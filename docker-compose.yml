services:
  uet-cloud-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uet-cloud-test
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
